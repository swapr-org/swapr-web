name: pipeline

on:
  push:
    branches: ["**"]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist
          retention-days: 7

  deploy-qa:
    needs: verify
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: qa
    concurrency:
      group: ${{ github.repository }}-deploy-qa
      cancel-in-progress: false
    env:
      APP_ENVIRONMENT: qa
      PAGES_PROJECT: swapr-web-qa
      SUPABASE_URL: ${{ vars.SUPABASE_URL }}
      SUPABASE_ANON_KEY: ${{ vars.SUPABASE_ANON_KEY }}
      USER_SERVICE_URL: ${{ vars.USER_SERVICE_URL }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - name: Write config.json
        run: >-
          jq -n
          --arg environment "$APP_ENVIRONMENT"
          --arg supabaseUrl "$SUPABASE_URL"
          --arg supabaseAnonKey "$SUPABASE_ANON_KEY"
          --arg userServiceUrl "$USER_SERVICE_URL"
          '{environment: $environment, supabaseUrl: $supabaseUrl, supabaseAnonKey: $supabaseAnonKey, userServiceUrl: $userServiceUrl}'
          > dist/config.json
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: Deploy to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4 pages deploy dist --project-name "$PAGES_PROJECT" --branch main
      - name: Check deployed config
        run: |
          for attempt in $(seq 1 12); do
            if curl -fsS "https://${PAGES_PROJECT}.pages.dev/config.json" -o deployed.json \
              && jq -e --arg env "$APP_ENVIRONMENT" --arg url "$SUPABASE_URL" \
                '.environment == $env and .supabaseUrl == $url' deployed.json > /dev/null; then
              echo "Deployed config matches ${APP_ENVIRONMENT}"
              exit 0
            fi
            sleep 10
          done
          echo "Deployed config does not match ${APP_ENVIRONMENT}"
          exit 1

  deploy-prod:
    needs: deploy-qa
    runs-on: ubuntu-latest
    environment: prod
    concurrency:
      group: ${{ github.repository }}-deploy-prod
      cancel-in-progress: true
    env:
      APP_ENVIRONMENT: prod
      PAGES_PROJECT: swapr-web-prod
      SUPABASE_URL: ${{ vars.SUPABASE_URL }}
      SUPABASE_ANON_KEY: ${{ vars.SUPABASE_ANON_KEY }}
      USER_SERVICE_URL: ${{ vars.USER_SERVICE_URL }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - name: Write config.json
        run: >-
          jq -n
          --arg environment "$APP_ENVIRONMENT"
          --arg supabaseUrl "$SUPABASE_URL"
          --arg supabaseAnonKey "$SUPABASE_ANON_KEY"
          --arg userServiceUrl "$USER_SERVICE_URL"
          '{environment: $environment, supabaseUrl: $supabaseUrl, supabaseAnonKey: $supabaseAnonKey, userServiceUrl: $userServiceUrl}'
          > dist/config.json
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: Deploy to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4 pages deploy dist --project-name "$PAGES_PROJECT" --branch main
      - name: Check deployed config
        run: |
          for attempt in $(seq 1 12); do
            if curl -fsS "https://${PAGES_PROJECT}.pages.dev/config.json" -o deployed.json \
              && jq -e --arg env "$APP_ENVIRONMENT" --arg url "$SUPABASE_URL" \
                '.environment == $env and .supabaseUrl == $url' deployed.json > /dev/null; then
              echo "Deployed config matches ${APP_ENVIRONMENT}"
              exit 0
            fi
            sleep 10
          done
          echo "Deployed config does not match ${APP_ENVIRONMENT}"
          exit 1
